<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16082e"/>
      <stop offset="65%" stop-color="#070214"/>
      <stop offset="100%" stop-color="#020614"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6d1"/>
      <stop offset="30%" stop-color="#e5c05b"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6714"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5e5a3"/>
      <stop offset="100%" stop-color="#b88a1e"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020614" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Cosmic Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="10"/>
  <!-- Decorative Celestial Rings -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,5" opacity="0.65"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.35"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="170" fill="url(#coreGlow)"/>

  <g filter="url(#glow)">
    <!-- Primary Cardinal Star (North-South-East-West) -->
    <path d="M256,40 L274,212 L446,256 L274,300 L256,472 L238,300 L66,256 L238,212 Z" fill="url(#goldGrad)"/>

    <!-- Diagonal Secondary Star -->
    <path d="M256,96 L272,224 L400,256 L272,288 L256,416 L240,288 L112,256 L240,224 Z" fill="url(#goldGrad2)" transform="rotate(45 256 256)" opacity="0.9"/>

    <!-- Crescent Moon Motif encircling core -->
    <path d="M 226,200 A 62,62 0 1,0 286,312 A 52,52 0 1,1 226,200 Z" fill="url(#goldGrad2)" opacity="0.85"/>

    <!-- Central Sacred Eye / Diamond Portal -->
    <circle cx="256" cy="256" r="32" fill="#03081a" stroke="url(#goldGrad)" stroke-width="5"/>
    <polygon points="256,234 278,256 256,278 234,256" fill="url(#goldGrad2)"/>
    <circle cx="256" cy="256" r="7" fill="#ffffff"/>
  </g>

  <!-- Celestial accent sparkles -->
  <circle cx="170" cy="170" r="4" fill="#fff6d1" opacity="0.8"/>
  <circle cx="342" cy="170" r="4" fill="#fff6d1" opacity="0.8"/>
  <circle cx="170" cy="342" r="4" fill="#fff6d1" opacity="0.8"/>
  <circle cx="342" cy="342" r="4" fill="#fff6d1" opacity="0.8"/>
</svg>